<!doctype html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>VRH — Šifrarnik</title>
<link rel="stylesheet" href="css/keys.css?v=20260922e" />
</head>
<body>
  <div id="pageLogin" class="login-page">
    <form id="loginForm" class="login-box">
      <h1>Šifrarnik</h1>
      <p class="login-subtitle">Prijava istim VRH nalogom</p>
      <label>Email <input type="email" id="loginEmail" required autocomplete="username" /></label>
      <label>Lozinka <input type="password" id="loginPassword" required autocomplete="current-password" /></label>
      <button type="submit" class="btn btn-primary">Prijava</button>
      <p id="loginError" class="login-error" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <h1>VRH</h1>
      <button type="button" id="logoutBtn" class="btn btn-ghost">Odjava</button>
    </header>

    <nav id="tabNav" class="tab-nav" hidden>
      <button type="button" id="tabSifrarnik" class="tab-nav-btn is-active">Šifrarnik</button>
      <button type="button" id="tabInformacije" class="tab-nav-btn">Informacije</button>
    </nav>

    <div id="globalNoAccess" class="empty-state" hidden>
      Nemate dozvolu ni za jednu stranicu. Obratite se administratoru.
    </div>

    <section id="pageSifrarnik">
      <div id="sifrarnikToolbar" class="toolbar">
        <input type="text" id="sifrarnikSearch" class="search-input" placeholder="Pretraga..." />
        <button type="button" id="sifrarnikAddBtn" class="btn btn-primary" hidden>+ Dodaj</button>
      </div>
      <main id="sifrarnikList" class="keys-list"></main>
      <div id="sifrarnikNoAccess" class="empty-state" hidden>
        Nemate dozvolu za šifrarnik. Obratite se administratoru.
      </div>
    </section>

    <section id="pageInformacije" hidden>
      <div id="informacijeToolbar" class="toolbar">
        <input type="text" id="informacijeSearch" class="search-input" placeholder="Pretraga..." />
        <button type="button" id="informacijeAddBtn" class="btn btn-primary" hidden>+ Dodaj</button>
      </div>
      <main id="informacijeList" class="keys-list"></main>
      <div id="informacijeNoAccess" class="empty-state" hidden>
        Nemate dozvolu za informacije. Obratite se administratoru.
      </div>
    </section>
  </div>

  <!-- Modal: nova/izmena šifra -->
  <div id="sifrarnikModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="sifrarnikModalTitle">Nova šifra</h2>
      <form id="sifrarnikForm">
        <label>
          Grupa
          <div class="keys-grupa-row">
            <select id="sifrarnikGrupa"></select>
            <button type="button" id="sifrarnikClearGrupaBtn" class="keys-icon-btn" title="Ukloni grupu sa ove šifre">✕</button>
            <button type="button" id="sifrarnikRenameGrupaBtn" class="keys-icon-btn" title="Preimenuj izabranu grupu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button type="button" id="sifrarnikDeleteGrupaBtn" class="keys-icon-btn keys-icon-btn-danger" title="Obriši izabranu grupu iz spiska">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            <button type="button" id="sifrarnikNewGrupaBtn" class="btn" title="Dodaj novu grupu">+ Nova</button>
          </div>
        </label>
        <label>
          Ime (na šta se odnosi)
          <input type="text" id="sifrarnikIme" required />
        </label>
        <label>
          Username
          <input type="text" id="sifrarnikUsername" autocomplete="off" />
        </label>
        <label>
          Password
          <input type="text" id="sifrarnikPassword" autocomplete="off" />
        </label>
        <label>
          Link
          <input type="text" id="sifrarnikLink" placeholder="https://..." />
        </label>
        <label>
          Pristup
          <input type="text" id="sifrarnikPristup" placeholder="npr. Administrator" />
        </label>
        <label>
          Komentar
          <textarea id="sifrarnikKomentar" rows="2"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelSifrarnikBtn" class="btn">Otkaži</button>
          <button type="submit" class="btn btn-primary">Sačuvaj</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: nova/izmena informacija -->
  <div id="informacijaModal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="informacijaModalTitle">Nova informacija</h2>
      <form id="informacijaForm">
        <label>
          Grupa
          <div class="keys-grupa-row">
            <select id="informacijaGrupa"></select>
            <button type="button" id="informacijaClearGrupaBtn" class="keys-icon-btn" title="Ukloni grupu sa ove informacije">✕</button>
            <button type="button" id="informacijaRenameGrupaBtn" class="keys-icon-btn" title="Preimenuj izabranu grupu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button type="button" id="informacijaDeleteGrupaBtn" class="keys-icon-btn keys-icon-btn-danger" title="Obriši izabranu grupu iz spiska">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            <button type="button" id="informacijaNewGrupaBtn" class="btn" title="Dodaj novu grupu">+ Nova</button>
          </div>
        </label>
        <label>
          Naslov
          <input type="text" id="informacijaNaslov" required />
        </label>
        <label>
          Tekst
          <textarea id="informacijaTekst" rows="5"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelInformacijaBtn" class="btn">Otkaži</button>
          <button type="submit" class="btn btn-primary">Sačuvaj</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: podeli šifru (WhatsApp/Viber/Telegram/Email) -->
  <div id="shareModal" class="modal-overlay" hidden>
    <div class="modal modal-share">
      <h2 id="shareModalTitle">Podeli</h2>
      <div class="share-options">
        <button type="button" class="share-option" data-share="whatsapp">
          <span class="share-option-icon share-icon-whatsapp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span>WhatsApp</span>
        </button>
        <button type="button" class="share-option" data-share="viber">
          <span class="share-option-icon share-icon-viber">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <span>Viber</span>
        </button>
        <button type="button" class="share-option" data-share="telegram">
          <span class="share-option-icon share-icon-telegram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </span>
          <span>Telegram</span>
        </button>
        <button type="button" class="share-option" data-share="email">
          <span class="share-option-icon share-icon-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
          </span>
          <span>Email</span>
        </button>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelShareBtn" class="btn">Otkaži</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/keys.js?v=20260922e"></script>
</body>
</html>
